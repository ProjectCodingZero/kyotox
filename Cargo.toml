[package]
name = "kyotox"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "kyotox-core",
    "kyotox-gui",
    "kyotox-script",
    "kyotox-tui"
]

[workspace.dependencies]
thiserror = "2.0.20"
rayon = { version = "1.11" }
smol = "2.0.2"
humantime = "2.4.0"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8+spec-1.1.0"
parking_lot = "0.12.5"

[dependencies]
color-eyre = "0.6"
clap = { version = "4.6.1", features = ["derive", "color"] }
mimalloc = { version= "*", features = ["secure"] }

#intern import
kyotox-core = { path = "kyotox-core" }
#revisar donde
# mlua = { version = "0.10.5", features = ["lua54", "vendored"] }


[features]


