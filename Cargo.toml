[workspace]
members = [
    "kyotox-core",
    "kyotox-gui",
    "kyotox-script",
    "kyotox-tui"
]
resolver = "2"

[workspace.dependencies]
kyotox-core = { path = "kyotox-core" }
kyotox-script = { path = "kyotox-script"}
mimalloc = { version= "0.1.52", features = ["secure"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
parking_lot = "0.12.5"
clap = { version = "4.6.7", features = ["derive", "color"] }
color-eyre = "0.6.5"
log = { version="0.4.34", features = ["std", "serde"] }
# mlua = { version = "0.10.5", features = ["lua54", "vendored"] }