name: Check for CRLF
on: [push, pull_request]

jobs:
  check-line-endings:
    runs-on: docker
    container:
      image: alpine:lastest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Verify if not CRLF
        run: |
          files=$(grep -lR $'\r' .)
          if [ ! -z "$files" ]; then
          echo "Error: Se detectaron archivos con CRLF"
          exit 1
        fi