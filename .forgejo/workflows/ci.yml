name: Check for CRLF
on: [push, pull_request]

jobs:
  check-line-endings:
    runs-on: codeberg-tiny
    container:
      image: alpine:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify if not CRLF
        run: |
          files=$(grep -lR $'\r' .)
          if [ ! -z "$files" ]; then
            echo "Error: Se detectaron archivos con CRLF"
            exit 1
          fi
          

      - name: Build Project
        run: cargo build --verbose
      - name: Test Project
        run: cargo test --verbose