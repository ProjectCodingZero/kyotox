name: Check for CRLF
on: 
  push:
    branches:
      - main 
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-line-endings:
    runs-on: codeberg-medium
    container:
      image: rust:alpine
    steps:
      - name: Toolchain Configuration Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies for Actions
        run: |
          apk add --no-cache nodejs git file
          rustup component add clippy

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify if not CRLF
        run: |
          files=$(find . -type f -not -path "./.git/*" -not -path "./target/*" -exec file {} + | grep "CRLF" | cut -d: -f1)
          if [ -n "$files" ]; then
            echo "Error: Files are not using LF"
            echo "$files"
            echo "HAS_CRLF=true" > /tmp/has_crlf_error
          else
            echo "OK: Files only uses LF"
            echo "HAS_CRLF=false" > /tmp/has_crlf_error
          fi
        continue-on-error: true

      - name: Run Build
        if: github.ref_name == 'main'
        run: |
          cargo build ${{ github.ref_name == 'main' && '--release' || '' }} --verbose

      - name: Run Clippy
        run: |
          cargo clippy -- -D warnings
    